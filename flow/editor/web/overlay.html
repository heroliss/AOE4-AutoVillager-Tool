<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AOE4 Overlay</title>
<style>
  /* 背景全透明：让出系统玻璃与游戏画面。内容透明度由 --ca 单独控制。
     html/body 用 max-content + overflow:visible，使整条按内容自然撑开，便于测量真实宽高后把窗口收到贴合内容。 */
  html, body { margin: 0; height: 100%; width: max-content; background: transparent; overflow: visible;
    font-family: "Microsoft YaHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; cursor: default; }
  :root { --ca: 1; }                 /* 内容不透明度（0.3~1），与背景玻璃独立 */

  /* 很窄、很透的玻璃条：自身几乎不画背景（背景全靠系统玻璃），只留极细边框勾出轮廓。 */
  #bar { display: inline-flex; align-items: center; gap: 6px; width: max-content; height: 100%; box-sizing: border-box;
    padding: 0 6px; background: transparent; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; }

  /* 文字/按钮全透明：直接把玻璃背景露出来，只有文字本身（带描边增强可读性）。 */
  #grip { cursor: move; color: rgba(255,255,255,calc(0.5 * var(--ca))); font-size: 12px; padding: 0 1px; line-height: 1; }
  #chips { display: inline-flex; align-items: center; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 12px; line-height: 1.1;
    opacity: var(--ca); text-shadow: 0 1px 2px rgba(0,0,0,0.55); }
  .chip .k { color: #dfe5ee; }
  .chip .v { font-weight: 700; }
  .chip .v.on  { color: #7bf0a2; }
  .chip .v.off { color: #ff9a9a; }

  #alert { display: none; align-items: center; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700;
    color: #fff; background: rgba(210,59,59,0.82); text-shadow: 0 1px 2px #0008; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 6px #ff3b3b55; } 50% { box-shadow: 0 0 16px #ff5b5bbb; } }

  #tools { display: inline-flex; align-items: center; gap: 3px; opacity: var(--ca); }
  .tbtn { cursor: pointer; color: #e6ebf3; font-size: 12px; padding: 1px 3px; border-radius: 5px;
    background: transparent; text-shadow: 0 1px 2px rgba(0,0,0,0.55); }
  .tbtn:hover { background: rgba(255,255,255,0.14); }
  .tbtn.act { color: #8fd6ff; }
</style>
</head>
<body>
  <div id="bar">
    <div id="grip" title="按住拖动可移动整条（限制在屏幕内）">⠿</div>
    <div id="chips"></div>
    <div id="alert"></div>
    <div id="tools">
      <span class="tbtn act" id="pinbtn" title="置顶" onclick="togglePin()">📌</span>
      <span class="tbtn" id="cfgbtn" title="设置（背景/内容透明度·毛度）" onclick="toggleCfg()">⚙</span>
    </div>
  </div>

<script>
  function api() { return (window.pywebview && window.pywebview.api) || null; }
  let pinned = true, ready = false;
  let winX = 0, winY = 0, winW = 200, winH = 26, screenW = 1920, screenH = 1080, lastFitW = 0;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  function render(d) {
    let html = "";
    for (const it of (d.items || [])) {
      const on = (it.value === true || it.value === "true" || it.value === 1);
      html += "<span class='chip'><span class='k'>" + esc(it.label) + "</span>" +
              "<span class='v " + (on ? "on" : "off") + "'>" + (on ? "开" : "关") + "</span></span>";
    }
    document.getElementById("chips").innerHTML =
      html || "<span class='chip'><span class='k'>（未选择要显示的开关）</span></span>";
    const al = document.getElementById("alert");
    if (d.bp_hit || d.paused) { al.style.display = "inline-flex"; al.textContent = "⏸ " + (d.bp_hit ? ("命中断点：" + d.bp_hit) : "已暂停"); }
    else { al.style.display = "none"; }
    if (d.content_alpha != null) document.documentElement.style.setProperty("--ca", (d.content_alpha / 100).toFixed(2));
    fitToContent();
  }

  // 内容自适应：测量整条真实宽高，把窗口收成贴合内容（玻璃只覆盖内容大小，不再占半屏）
  function fitToContent() {
    const r = document.getElementById("bar").getBoundingClientRect();
    const w = Math.ceil(r.width) + 2, h = Math.max(22, Math.ceil(r.height));
    if (Math.abs(w - lastFitW) >= 2) { lastFitW = w; try { api().overlay_resize(w, h); } catch (e) {} }
  }

  function toggleCfg() { try { api().toggle_overlay_cfg(); } catch (e) {} }
  function togglePin() {
    pinned = !pinned;
    try { api().overlay_set_on_top(pinned); } catch (e) {}
    document.getElementById("pinbtn").classList.toggle("act", pinned);
  }

  // —— 拖拽：用屏幕坐标(screenX/Y)做位移基准，本地+后端双重钳制在屏内 ——
  let dragging = false, sX = 0, sY = 0, aX = 0, aY = 0, pX = 0, pY = 0, raf = false;
  function flushMove() { raf = false; winX = pX; winY = pY; try { api().overlay_move(pX, pY); } catch (e) {} }
  function moveTo(nx, ny) {
    pX = Math.max(0, Math.min(nx, screenW - winW));
    pY = Math.max(0, Math.min(ny, screenH - winH));
    if (!raf) { raf = true; requestAnimationFrame(flushMove); }
  }
  document.getElementById("grip").addEventListener("mousedown", (e) => {
    dragging = true; sX = e.screenX; sY = e.screenY; aX = winX; aY = winY; e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => { if (dragging) moveTo(aX + (e.screenX - sX), aY + (e.screenY - sY)); });
  window.addEventListener("mouseup", () => { dragging = false; });

  function poll() {
    const a = api();
    if (!a) { setTimeout(poll, 200); return; }
    Promise.resolve(a.overlay_data()).then(d => {
      if (!d) return;
      if (d.screen) { screenW = d.screen[0]; screenH = d.screen[1]; }
      if (d.rect) { winW = d.rect[2]; winH = d.rect[3]; if (!dragging) { winX = d.rect[0]; winY = d.rect[1]; } }
      ready = true;
      render(d);
    }).catch(() => {}).finally(() => setTimeout(poll, 500));
  }
  poll();
</script>
</body>
</html>
