<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AOE4 Overlay</title>
<style>
  /* 背景全透明：让出系统玻璃与游戏画面。内容透明度由 --ca 单独控制。
     overflow:hidden 杜绝 WebView2 滚动条；宽度仍用 max-content 让整条按内容撑开(便于测量后把窗口收到贴合)。 */
  html, body { margin: 0; height: 100%; width: max-content; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; cursor: default; }
  :root { --ca: 1; }                 /* 内容不透明度（0.3~1），与背景玻璃独立 */

  /* 很透的玻璃条：自身几乎不画背景（背景全靠系统玻璃），只留极细边框勾出轮廓。 */
  #bar { display: inline-flex; align-items: center; gap: 8px; width: max-content; height: 100%; box-sizing: border-box;
    padding: 0 10px; background: transparent; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; }

  /* 文字/按钮全透明：直接把玻璃背景露出来，只有文字本身（带描边增强可读性）。 */
  #grip { cursor: move; color: rgba(255,255,255,calc(0.5 * var(--ca))); font-size: 12px; padding: 0 1px; line-height: 1; }
  /* 运行/暂停 合并按钮：未跑/暂停=绿(可启动/继续)，运行中=琥珀(可暂停)。放在最左，游戏里好按。 */
  #runbtn { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 12px;
    line-height: 1; padding: 2px 9px; border-radius: 11px; font-weight: 700; opacity: var(--ca);
    border: 1px solid rgba(255,255,255,0.18); text-shadow: 0 1px 2px rgba(0,0,0,0.6); transition: background .12s; }
  #runbtn:hover { background: rgba(255,255,255,0.14); }
  #runbtn.run   { border-color: rgba(110,240,150,0.5); background: rgba(70,200,110,0.16); color: #9af0bd; }
  #runbtn.pause { border-color: rgba(255,200,110,0.5); background: rgba(230,170,60,0.16); color: #ffd98a; }
  #chips { display: inline-flex; align-items: center; gap: 7px; }
  /* 开关芯片：可点击切换。整片有一层很淡的描边/底，开=偏绿、关=偏红，点一下就翻。 */
  .chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 12px; line-height: 1;
    opacity: var(--ca); text-shadow: 0 1px 2px rgba(0,0,0,0.6); cursor: pointer; padding: 2px 7px; border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.16); transition: background .12s; }
  .chip:hover { background: rgba(255,255,255,0.14); }
  .chip.on  { border-color: rgba(110,240,150,0.5);  background: rgba(70,200,110,0.14); }
  .chip.off { border-color: rgba(255,130,130,0.45); background: rgba(220,80,80,0.12); }
  .chip .k { color: #eef2f8; }
  .chip .v { font-weight: 700; }
  .chip .v.on  { color: #7bf0a2; }
  .chip .v.off { color: #ff9a9a; }
  /* 只读项（数值/文本/非开关布尔）：中性描边、不可点，右侧显示当前值（数字等宽对齐） */
  .chip.val { cursor: default; border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); }
  .chip.val:hover { background: rgba(255,255,255,0.05); }
  .chip .nv { font-weight: 700; color: #cfe3ff; font-variant-numeric: tabular-nums; }

  /* 弹信息：运行中值得提醒的事件（自动关开关/输入屏蔽失败/命中断点/已暂停）——按级别上色、脉冲，醒目瞬时弹出 */
  #alert { display: none; align-items: center; padding: 1px 9px; border-radius: 6px; font-size: 12px; font-weight: 700;
    color: #fff; text-shadow: 0 1px 2px #0008; animation: pulse 1s ease-in-out infinite; }
  #alert.lv-error { background: rgba(210,59,59,0.88); }
  #alert.lv-warn  { background: rgba(214,158,46,0.92); }
  #alert.lv-info  { background: rgba(58,120,200,0.86); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 6px #0000; } 50% { box-shadow: 0 0 16px #ffffff66; } }

  #tools { display: inline-flex; align-items: center; gap: 3px; opacity: var(--ca); }
  .tbtn { cursor: pointer; color: #e6ebf3; font-size: 12px; padding: 1px 3px; border-radius: 5px;
    background: transparent; text-shadow: 0 1px 2px rgba(0,0,0,0.55); }
  .tbtn:hover { background: rgba(255,255,255,0.14); }
  .tbtn.act { color: #8fd6ff; }
</style>
</head>
<body>
  <div id="bar">
    <div id="grip" title="按住拖动可移动整条（限制在屏幕内）">⠿</div>
    <div id="runbtn" class="run" title="运行/暂停：在游戏里直接启停流程；暂停后可回主界面查看当帧的流程信息" onclick="toggleRunBtn()">▶ 启动</div>
    <div id="chips"></div>
    <div id="alert"></div>
    <div id="tools">
      <span class="tbtn" id="monbtn" title="资源监控（CPU/内存/曲线，独立玻璃小窗）" onclick="toggleMon()">📊</span>
      <span class="tbtn" id="cfgbtn" title="设置（背景/内容透明度·模糊）" onclick="toggleCfg()">⚙</span>
    </div>
  </div>

<script>
  function api() { return (window.pywebview && window.pywebview.api) || null; }
  let winX = 0, winY = 0, winW = 240, winH = 30, screenW = 1920, screenH = 1080, lastFitW = 0;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  const switchState = {};   // id -> 当前开关态（点击时据此翻转 + 乐观更新）

  function render(d) {
    let html = "";
    for (const it of (d.items || [])) {
      if (it.kind === "bool" && it.editable) {     // 开关：可点切（绿/红）
        const on = (it.value === true || it.value === "true" || it.value === 1);
        switchState[it.id] = on;
        html += "<span class='chip " + (on ? "on" : "off") + "' data-edit='1' data-id='" + esc(it.id) + "' title='点击切换'>" +
                "<span class='k'>" + esc(it.label) + "</span>" +
                "<span class='v " + (on ? "on" : "off") + "'>" + (on ? "开" : "关") + "</span></span>";
      } else {                                      // 只读：数值/文本/非开关布尔——显示标签+当前值，不可点
        let vtext;
        if (it.kind === "bool") vtext = (it.value === true || it.value === 1) ? "开" : "关";
        else vtext = String(it.value == null ? "" : it.value);
        html += "<span class='chip val' title='只读显示'>" +
                "<span class='k'>" + esc(it.label) + "</span>" +
                "<span class='nv'>" + esc(vtext) + "</span></span>";
      }
    }
    document.getElementById("chips").innerHTML =
      html || "<span class='chip' style='cursor:default;border:0;background:none'><span class='k'>（未选择要显示的项：编辑器里勾“显示到覆盖层”）</span></span>";
    setRunBtn(d);
    // 弹信息：新的 WARN/ERROR 运行事件（如“未检测到市场→已关闭出商人”）→ 醒目瞬时弹出 4.5s
    if (d.notice && d.notice.id && d.notice.id !== lastNoticeId) {
      lastNoticeId = d.notice.id;
      flashAlert(d.notice.msg, d.notice.level === "ERROR" ? "error" : "warn", 4500);
    }
    if (Date.now() < alertHoldUntil) { /* 瞬时弹信息/提示期间不被覆盖 */ }
    else if (d.bp_hit) { applyAlert("⏸ 命中断点：" + d.bp_hit, "error"); }
    else if (d.paused) { applyAlert("⏸ 已暂停", "warn"); }
    else { document.getElementById("alert").style.display = "none"; }
    if (d.content_alpha != null) document.documentElement.style.setProperty("--ca", (d.content_alpha / 100).toFixed(2));
    fitToContent();
  }
  // 运行/暂停 合并按钮：据运行态显示「启动 / 继续 / 暂停」并上对应颜色。
  function setRunBtn(d) {
    const b = document.getElementById("runbtn"); if (!b) return;
    if (d && d.running) { b.textContent = "⏸ 暂停"; b.className = "pause"; }
    else if (d && d.paused) { b.textContent = "▶ 继续"; b.className = "run"; }
    else { b.textContent = "▶ 启动"; b.className = "run"; }
  }
  let alertHoldUntil = 0, lastNoticeId = 0;
  function applyAlert(text, level) {
    const al = document.getElementById("alert"); if (!al) return;
    al.className = "lv-" + (level || "warn"); al.style.display = "inline-flex"; al.textContent = text;
  }
  function flashAlert(msg, level, ms) { applyAlert("⚠ " + msg, level || "warn"); alertHoldUntil = Date.now() + (ms || 2500); }
  function toggleRunBtn() {
    try {
      Promise.resolve(api().overlay_run_toggle()).then((r) => {
        if (!r) return;
        if (r.reason) flashAlert(r.reason, "info");     // 还没运行过 → 提示先在主界面点一次运行
        setRunBtn(r);
      }).catch(() => {});
    } catch (e) {}
  }

  // 内容自适应：只测量【宽度】，把窗口收成贴合内容（玻璃只覆盖内容大小）。高度固定 30(够放下内容、不出滚动条)。
  function fitToContent() {
    const bar = document.getElementById("bar");
    const w = Math.max(120, Math.ceil(Math.max(bar.scrollWidth, bar.offsetWidth, bar.getBoundingClientRect().width)) + 2);
    if (Math.abs(w - lastFitW) >= 3) { lastFitW = w; try { api().overlay_resize(w, 30); } catch (e) {} }
  }

  // 📊/⚙ 都是开/关切换按钮：点一下开、再点关，并把按钮点亮(.act)反映当前开关状态。
  function toggleBtn(btnId, fn) {
    try {
      Promise.resolve(fn()).then(r => {
        const b = document.getElementById(btnId);
        if (b) b.classList.toggle("act", !!(r && r.open));
      }).catch(() => {});
    } catch (e) {}
  }
  function toggleCfg() { toggleBtn("cfgbtn", () => api().toggle_overlay_cfg()); }
  function toggleMon() { toggleBtn("monbtn", () => api().toggle_overlay_mon()); }

  // 点开关芯片：乐观翻转 UI(不等 500ms 轮询) + 通知后端实时启停该段
  function applyChipUI(chip, on) {
    chip.classList.toggle("on", on); chip.classList.toggle("off", !on);
    const v = chip.querySelector(".v");
    if (v) { v.textContent = on ? "开" : "关"; v.className = "v " + (on ? "on" : "off"); }
  }
  document.getElementById("chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip[data-edit]"); if (!chip) return;   // 只有开关项可点切，只读项不响应
    const id = chip.dataset.id, on = !switchState[id];
    switchState[id] = on; applyChipUI(chip, on);
    try { api().overlay_set_switch(id, on); } catch (err) {}
  });
  // —— 拖拽：用屏幕坐标(screenX/Y)做位移基准，本地+后端双重钳制在屏内 ——
  let dragging = false, sX = 0, sY = 0, aX = 0, aY = 0, pX = 0, pY = 0, raf = false;
  function flushMove() { raf = false; winX = pX; winY = pY; try { api().overlay_move(pX, pY); } catch (e) {} }
  function moveTo(nx, ny) {
    // 各边都留 1px：保证四边的“贴边移镜”触发区永远是游戏画面，窄条不会完全贴边
    pX = Math.max(1, Math.min(nx, screenW - winW - 1));
    pY = Math.max(1, Math.min(ny, screenH - winH - 1));
    if (!raf) { raf = true; requestAnimationFrame(flushMove); }
  }
  document.getElementById("grip").addEventListener("mousedown", (e) => {
    dragging = true; sX = e.screenX; sY = e.screenY; aX = winX; aY = winY; e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => { if (dragging) moveTo(aX + (e.screenX - sX), aY + (e.screenY - sY)); });
  window.addEventListener("mouseup", () => { dragging = false; });

  function poll() {
    const a = api();
    if (!a) { setTimeout(poll, 200); return; }
    Promise.resolve(a.overlay_data()).then(d => {
      if (!d) return;
      if (d.screen) { screenW = d.screen[0]; screenH = d.screen[1]; }
      if (d.rect) { winW = d.rect[2]; winH = d.rect[3]; if (!dragging) { winX = d.rect[0]; winY = d.rect[1]; } }
      render(d);
    }).catch(() => {}).finally(() => setTimeout(poll, 500));
  }
  poll();
</script>
</body>
</html>
