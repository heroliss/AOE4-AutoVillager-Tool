<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AOE4 Overlay</title>
<style>
  /* 背景全透明：让出系统亚克力（毛玻璃）与游戏画面。内容透明度由 --ca 单独控制。 */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; cursor: default; }
  :root { --ca: 1; }                 /* 内容不透明度（0.3~1），与背景毛玻璃独立 */

  /* 玻璃窄条：本身近乎透明（靠系统亚克力提供模糊底）；留一层极淡兜底色，亚克力失效时也有依托。 */
  #bar { display: flex; align-items: center; gap: 7px; height: 100%; box-sizing: border-box;
    padding: 0 8px; background: rgba(11,14,20,0.22); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9px; backdrop-filter: saturate(1.2); }

  /* 抓手：可拖动整条到屏幕任意处（pywebview 识别此类为拖拽区） */
  #grip { cursor: move; color: rgba(255,255,255,calc(0.5 * var(--ca))); font-size: 13px; padding: 0 2px;
    line-height: 1; -webkit-app-region: drag; }
  #grip.pywebview-drag-region { }

  #chips { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; }
  .chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: none;
    padding: 3px 8px; border-radius: 7px; font-size: 12px; line-height: 1.1;
    background: rgba(255,255,255,calc(0.06 * var(--ca))); opacity: var(--ca); }
  .chip .k { color: #aeb6c4; }
  .chip .v { font-weight: 700; color: #e8ecf3; }
  .chip .v.on  { color: #5ee08a; }
  .chip .v.off { color: #ff7b7b; }
  .chip.num .v { color: #ffd45e; }

  /* 弹信息：命中断点/自动改写开关等，醒目脉冲（不挡主视野，仍在窄条内） */
  #alert { display: none; align-items: center; gap: 6px; flex: none; padding: 3px 10px; border-radius: 7px;
    font-size: 12px; font-weight: 700; color: #fff; background: #d23b3b; box-shadow: 0 0 12px #ff3b3b88;
    animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 8px #ff3b3b66; } 50% { box-shadow: 0 0 18px #ff5b5bcc; } }

  /* 右侧小工具区 */
  #tools { display: flex; align-items: center; gap: 4px; flex: none; opacity: var(--ca); }
  .tbtn { cursor: pointer; color: #cfd6e2; font-size: 13px; padding: 2px 5px; border-radius: 6px;
    background: rgba(255,255,255,0.05); }
  .tbtn:hover { background: rgba(255,255,255,0.14); }
  .tbtn.act { color: #7fd0ff; background: rgba(80,160,255,0.18); }

  /* 设置浮层：调背景/内容透明度 + 置顶 */
  #cfg { display: none; position: absolute; right: 6px; top: 42px; width: 188px; padding: 9px 11px;
    background: rgba(18,22,30,0.96); border: 1px solid #3a4150; border-radius: 9px; color: #dfe4ec; font-size: 12px;
    box-shadow: 0 6px 22px #000a; }
  #cfg .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  #cfg .row label { width: 42px; color: #aeb6c4; }
  #cfg input[type=range] { flex: 1; }
  #cfg .row .pin { cursor: pointer; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); }
  #cfg .row .pin.on { color: #7fd0ff; background: rgba(80,160,255,0.2); }
</style>
</head>
<body>
  <div id="bar">
    <div id="grip" class="pywebview-drag-region" title="拖动可移动整条">⠿</div>
    <div id="chips"></div>
    <div id="alert"></div>
    <div id="tools">
      <span class="tbtn" id="pinbtn" title="置顶" onclick="togglePin()">📌</span>
      <span class="tbtn" id="cfgbtn" title="显示设置" onclick="toggleCfg()">⚙</span>
    </div>
  </div>
  <div id="cfg">
    <div class="row"><label>背景</label><input id="bg" type="range" min="0" max="255" value="150" oninput="setBg(this.value)"></div>
    <div class="row"><label>内容</label><input id="ct" type="range" min="30" max="100" value="100" oninput="setCa(this.value)"></div>
    <div class="row"><label>置顶</label><span class="pin on" id="pinrow" onclick="togglePin()">已置顶</span></div>
  </div>

<script>
  function api() { return (window.pywebview && window.pywebview.api) || null; }
  let pinned = true, ready = false;

  function fmtVal(it) {
    if (it.kind === "bool") {
      const on = (it.value === true || it.value === "true" || it.value === 1);
      return ["<span class='v " + (on ? "on" : "off") + "'>" + (on ? "开" : "关") + "</span>", on ? "" : ""];
    }
    return ["<span class='v'>" + (it.value == null ? "—" : String(it.value)) + "</span>", ""];
  }

  function render(d) {
    const chips = document.getElementById("chips");
    let html = "";
    for (const it of (d.items || [])) {
      const cls = (it.kind === "int" || it.kind === "float") ? "chip num" : "chip";
      html += "<span class='" + cls + "'><span class='k'>" + esc(it.label) + "</span>" + fmtVal(it)[0] + "</span>";
    }
    chips.innerHTML = html || "<span class='chip'><span class='k'>（控制面板为空）</span></span>";
    // 弹信息：命中断点 / 暂停
    const al = document.getElementById("alert");
    if (d.bp_hit || d.paused) {
      al.style.display = "inline-flex";
      al.textContent = "⏸ " + (d.bp_hit ? ("命中断点：" + d.bp_hit) : "已暂停");
    } else {
      al.style.display = "none";
    }
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  function setBg(v) { try { api().overlay_set_bg(parseInt(v, 10)); } catch (e) {} }
  function setCa(v) { document.documentElement.style.setProperty("--ca", (parseInt(v, 10) / 100).toFixed(2)); }
  function toggleCfg() {
    const c = document.getElementById("cfg");
    c.style.display = c.style.display === "block" ? "none" : "block";
    document.getElementById("cfgbtn").classList.toggle("act", c.style.display === "block");
  }
  function togglePin() {
    pinned = !pinned;
    try { api().overlay_set_on_top(pinned); } catch (e) {}
    document.getElementById("pinbtn").classList.toggle("act", pinned);
    const pr = document.getElementById("pinrow");
    pr.classList.toggle("on", pinned); pr.textContent = pinned ? "已置顶" : "未置顶";
  }

  function poll() {
    const a = api();
    if (!a) { setTimeout(poll, 200); return; }   // 等 pywebview 注入 api
    Promise.resolve(a.overlay_data()).then(d => {
      if (!ready) {
        ready = true;
        document.getElementById("pinbtn").classList.add("act");
        if (d && d.bg_alpha != null) document.getElementById("bg").value = d.bg_alpha;
      }
      if (d) render(d);
    }).catch(() => {}).finally(() => setTimeout(poll, 500));
  }
  poll();
</script>
</body>
</html>
