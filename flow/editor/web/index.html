<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AoE4 自动化节点编辑器</title>
<link rel="stylesheet" href="vendor/litegraph.css">
<style>
  /* —— 配色变量：统一深色主题 + 一个蓝色强调色 —— */
  :root {
    --bg: #1b1e25; --bg2: #20242c; --panel: #1e222a; --line: #2e333d;
    --fg: #d4d8e0; --fg-dim: #8b929e; --accent: #5a93d4; --warn: #e6a23c;
    --btn: #2b313b; --btn-h: #353c48; --btn-line: #3c434f;
  }
  /* 让原生控件(数字微调箭头/颜色选择器/下拉)走深色，不再是白色割裂感 */
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font-family: "Microsoft YaHei", "SimHei", sans-serif; overflow: hidden;
               -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  #toolbar { height: 42px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
             background: linear-gradient(#262b34, #20242c); border-bottom: 1px solid var(--line);
             overflow: hidden; box-shadow: 0 1px 0 #0003; }
  /* 按钮/下拉：固定大小，窗口变窄也不压缩、不换行 */
  #toolbar button, #toolbar select {
             background: var(--btn); color: var(--fg); border: 1px solid var(--btn-line); border-radius: 6px;
             height: 28px; padding: 0 12px; cursor: pointer; font-size: 13px;
             flex: none; white-space: nowrap; transition: background .12s, border-color .12s; }
  #toolbar button:hover, #toolbar select:hover { background: var(--btn-h); border-color: #4a5260; }
  #toolbar button:active { background: #2a303a; transform: translateY(1px); }
  #toolbar button:disabled { opacity: .45; cursor: default; }
  #toolbar button.accent { background: #2f6b3f; border-color: #3f8a52; color: #eafff0; }
  #toolbar button.accent:hover { background: #357a48; }
  #toolbar button.accent.running { background: #8a5a2f; border-color: #b07a3f; }
  /* 使用模式（简单模式）：隐藏编辑专用按钮；画布转为只读（仍可拖动查看、运行、用控制面板调参），面向“只想用”的用户 */
  body.simple .edit-only { display: none !important; }
  #panel .phint { color: var(--fg-dim); font-size: 13px; padding: 8px 4px; line-height: 1.7; }
  #modebtn { background: #314a6b; border-color: #3f5f88; min-width: 96px; }
  #modebtn:hover { background: #395681; }
  /* 使用模式（只读）时按钮换成琥珀色，强化“当前只读、点一下进编辑”的状态感 */
  #modebtn.inuse { background: #5a4a2f; border-color: #8a6a3f; color: #ffe9c7; }
  #modebtn.inuse:hover { background: #6a572f; }
  /* 性能监控开关：开启时蓝色高亮，运行时在每个节点叠加「自身/累计」耗时 */
  #profbtn.on { background: #314a6b; border-color: #3f5f88; color: #cfe3ff; }
  #profbtn.on:hover { background: #395681; }
  #prevbtn.on { background: #314a6b; border-color: #3f5f88; color: #cfe3ff; }
  #prevbtn.on:hover { background: #395681; }
  /* 覆盖层按钮：与 ⏱耗时/🖼预览 同款——开启时蓝底高亮 */
  #overlaybtn.on { background: #314a6b; border-color: #3f5f88; color: #cfe3ff; }
  #overlaybtn.on:hover { background: #395681; }
  #toolbar button:focus-visible, #toolbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #toolbar select { max-width: 220px; }
  #toolbar .sep { flex: none; width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #toolbar .spacer { flex: 1 1 auto; min-width: 6px; }
  /* 工具栏右侧只放“静态使用提示”，空间不足时自身截断（绝不挤压按钮/文件信息） */
  #hint { color: var(--fg-dim); font-size: 12px; flex: 0 1 auto; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dirty:not(:empty) { color: var(--warn); font-size: 11px; font-weight: bold; flex: none;
           background: #e6a23c1f; border: 1px solid #e6a23c55; border-radius: 10px; padding: 1px 8px; }
  /* 文件信息（当前在编辑哪个流程）：固定在工具栏左侧，不被操作提示覆盖 */
  #flowmeta { color: var(--fg); font-size: 12px; flex: 0 1 auto; min-width: 0; max-width: 320px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #flowmeta .ro { color: var(--warn); }
  /* 操作提示（已保存/已撤销/已排版…）：底部居中的临时浮层，几秒后淡出，不再和文件信息抢位置 */
  #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(6px);
           background: #2b3038f2; color: #eef1f5; border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 16px; font-size: 13px; box-shadow: 0 6px 22px #0009; z-index: 200;
           opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; max-width: 80%;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toolbar optgroup { color: var(--fg-dim); font-style: normal; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  canvas { display: block; }
  /* 折叠节点的可编辑参数浮层：容器按图坐标摆放控件，整体 transform 跟随画布（见 applyFoldWidgetTransform） */
  #foldwidgets { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: visible;
                 transform-origin: 0 0; pointer-events: none; z-index: 5; }
  #foldwidgets .fw-row { position: absolute; display: flex; align-items: center; gap: 6px;
                 height: 24px; pointer-events: auto; }
  #foldwidgets .fw-dot { width: 6px; height: 6px; border-radius: 50%; background: #e6a23c; flex: none; display: none; }
  #foldwidgets .fw-label { color: #aeb6c2; font-size: 12px; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 48%; }
  #foldwidgets input, #foldwidgets select { background: #15171c; color: #cfd3da; border: 1px solid #444;
                 border-radius: 4px; height: 20px; font-size: 12px; padding: 1px 4px; box-sizing: border-box; }
  #foldwidgets input[type=number] { width: 66px; }
  #foldwidgets input[type=text] { width: 104px; }
  #foldwidgets input[type=checkbox] { width: 16px; height: 16px; }
  #foldwidgets select { max-width: 132px; }
  #foldwidgets button { background: #2b313b; color: #cfd3da; border: 1px solid #3c434f; border-radius: 4px;
                 height: 20px; font-size: 11px; cursor: pointer; padding: 0 6px; white-space: nowrap; flex: none; }
  /* 右键/下拉菜单（LiteGraph ContextMenu，默认 z-index:10）要浮在所有编辑弹窗（分组管理=150、确认框=170…）之上，
     否则像「分组管理」里点「归入」弹出的菜单会被窗口挡住。 */
  .litegraph.litecontextmenu { z-index: 300 !important; }
  /* 控制面板：置顶常用开关/数值，普通用户不进节点图也能调（在节点说明里勾选要显示的参数）。 */
  #panel { flex: none; display: none; flex-wrap: wrap; align-items: center; gap: 8px 12px;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
           max-height: 28vh; overflow-y: auto; }
  #panel .ptitle { color: var(--fg-dim); font-size: 11px; font-weight: bold; letter-spacing: .5px;
           text-transform: uppercase; margin-right: 2px; }
  /* 每个面板项做成小卡片，分隔更清楚、更美观 */
  #panel .pitem { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg);
           background: #262b33; border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; }
  #panel .pitem label { color: #aeb6c2; max-width: 220px; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
  #panel input[type=number], #panel input[type=text], #panel select, #panel button {
           background: #15171c; color: var(--fg); border: 1px solid var(--btn-line); border-radius: 5px;
           height: 22px; font-size: 12px; }
  #panel button { background: var(--btn); cursor: pointer; padding: 0 8px; }
  #panel button:hover { background: var(--btn-h); }
  #panel input[type=number] { width: 60px; }
  #panel select { max-width: 160px; }
  #panel .ploc { cursor: pointer; font-size: 12px; opacity: 0.5; }
  #panel .ploc:hover { opacity: 1; }
  /* 覆盖层显示开关（仅编辑模式）：灰=不显示、亮绿=已显示到游戏覆盖层 */
  #panel .pov { cursor: pointer; font-size: 12px; opacity: 0.42; filter: grayscale(1); user-select: none; }
  #panel .pov:hover { opacity: 0.8; }
  #panel .pov.on { opacity: 1; filter: none; text-shadow: 0 0 6px rgba(120,240,160,0.55); }
  /* 控制面板项的拖动柄（仅编辑模式显示）：拖动可调整顺序 */
  #panel .pgrip { cursor: grab; color: var(--fg-dim); font-size: 12px; user-select: none; margin-right: 1px; }
  #panel .pgrip:active { cursor: grabbing; }
  #panel .pitem.dragging { opacity: 0.45; }
  /* 日志面板与画布间的拖拽分隔条：上下拖动改变日志高度 */
  #logresize { flex: none; display: none; height: 7px; cursor: ns-resize; background: var(--line); }
  #logresize:hover { background: var(--accent); }
  /* 运行日志面板：运行时从底部弹出，显示引擎日志（哪个节点说了什么）。文本可选中复制。 */
  #logpanel { flex: none; display: none; height: 160px; overflow-y: auto; background: #14171d;
           border-top: 1px solid var(--line); padding: 0 0 4px; font: 12px/1.6 Consolas, "Microsoft YaHei", monospace;
           user-select: text; -webkit-user-select: text; cursor: auto; }
  #logpanel .lp-head { color: var(--fg-dim); position: sticky; top: 0; z-index: 2;
           background: linear-gradient(#1b1f27, #181c23); border-bottom: 1px solid var(--line);
           padding: 5px 12px; display: flex; align-items: center; gap: 8px; user-select: none; font-size: 12px; }
  #logpanel .lp-head .lp-title { font-weight: bold; color: #cdd3dc; }
  #logpanel .lp-head .lp-count { color: var(--fg-dim); }
  #logpanel .lp-head .spacer { flex: 1 1 auto; }
  #logpanel .lp-rows { padding: 4px 0; }
  /* 每条日志：时间 + 等级圆点 + 文本，按等级配色与左侧色条，便于一眼扫读 */
  #logpanel .lp-row { display: flex; align-items: baseline; gap: 8px; padding: 1px 12px 1px 9px;
           border-left: 3px solid transparent; white-space: pre-wrap; word-break: break-word; }
  #logpanel .lp-row:hover { background: #1b1f27; }
  #logpanel .lp-time { color: #6c727c; flex: none; font-variant-numeric: tabular-nums; }
  #logpanel .lp-dot { flex: none; }
  #logpanel .lp-msg { flex: 1 1 auto; }
  #logpanel .lp-row.lv-INFO  { border-left-color: #3a5a7a; }
  #logpanel .lp-row.lv-INFO  .lp-dot { color: #7fb0ee; } #logpanel .lp-row.lv-INFO  .lp-msg { color: #c3cad6; }
  #logpanel .lp-row.lv-WARN  { border-left-color: #8a6a2f; background: #2a230f33; }
  #logpanel .lp-row.lv-WARN  .lp-dot { color: #e6c07b; } #logpanel .lp-row.lv-WARN  .lp-msg { color: #e6c07b; }
  #logpanel .lp-row.lv-ERROR { border-left-color: #8a2f2f; background: #2a0f0f55; }
  #logpanel .lp-row.lv-ERROR .lp-dot { color: #ff7a7a; } #logpanel .lp-row.lv-ERROR .lp-msg { color: #ff9a9a; font-weight: bold; }
  #logpanel .lp-clear { cursor: pointer; color: #7fb0ee; }
  #logpanel .lp-clear:hover { text-decoration: underline; }
  /* —— 资源监控：迷你小窗在画布【右上角】常驻，点击展开下方的浮窗详情（可拖动/缩放/滚轮缩放曲线/置顶/半透明）—— */
  #sysmon { position: absolute; top: 10px; right: 10px; z-index: 60; display: flex; flex-direction: column;
            gap: 2px; background: #1d212bdd; border: 1px solid var(--line); border-radius: 8px;
            padding: 5px 8px 4px; cursor: pointer; opacity: .82; user-select: none;
            transition: opacity .15s, border-color .15s; box-shadow: 0 3px 12px #0006; }
  #sysmon:hover { opacity: 1; border-color: #4a5260; }
  #sysmon canvas { display: block; }
  #systext { font: 11px/1.3 Consolas, monospace; color: var(--fg-dim); white-space: nowrap; }
  #systext b { color: var(--fg); font-weight: normal; }
  #systext .sm-cpu { color: #7fb0ee; } #systext .sm-mem { color: #6fcf97; }
  /* 资源监控详情已独立为单独的系统窗口（web/sysmon.html）；编辑器内只留右上角迷你小窗 */
  /* 滚动条：细、暗，融入主题 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a414c; border-radius: 6px; border: 2px solid transparent;
           background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #4a525f; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="modebtn" onclick="ED.toggleSimple()" title="在“使用模式（画布只读，仅控制面板+运行）”和“编辑模式（可改节点图）”之间切换">使用模式</button>
    <span class="sep edit-only"></span>
    <button class="edit-only" onclick="ED.save()">保存</button>
    <button class="edit-only" onclick="ED.saveAs()">另存为</button>
    <button onclick="ED.open()">打开</button>
    <select id="builtin" onchange="ED.openBuiltin(this.value)"><option value="" disabled selected>打开内置流程…</option></select>
    <button id="locatebtn" style="display:none" onclick="ED.revealCurrent()" title="在系统文件浏览器中定位当前流程文件（仅「我的流程」——内置流程打包后不是独立文件）">📁 定位</button>
    <button id="removebtn" style="display:none" onclick="ED.removeCurrent()" title="从「我的流程」中删除当前流程文件（内置流程为只读，不能删）">🗑 移除</button>
    <span class="sep"></span>
    <button id="runbtn" class="accent" onclick="ED.toggleRun()" title="运行：执行当前流程（向游戏发送按键/鼠标）">▶ 运行</button>
    <button id="stopbtn" onclick="ED.stopRun()" disabled>停止</button>
    <button id="dryrunbtn" class="edit-only" onclick="ED.dryRun()" title="试运行（干跑）：只识别、不发送任何输入，用于调试核对">试运行</button>
    <button id="profbtn" onclick="ED.toggleProfile()" title="性能监控：运行时在每个节点叠加「本节点耗时 / 本帧累计耗时(ms)」，找出耗时大头">⏱ 耗时</button>
    <button id="prevbtn" onclick="ED.togglePreview()" title="截图预览：运行/试运行时在感知节点上显示「它实际截到的区域图」，用于核对截图范围对不对">🖼 预览</button>
    <button id="overlaybtn" onclick="ED.toggleOverlay()" title="游戏内覆盖层：在游戏上方悬一条透明毛玻璃窄条，显示控制面板/状态/弹信息（可调透明度、可拖动、不挡主视野）">🎮 覆盖层</button>
    <span class="sep"></span>
    <button onclick="ED.autolayout()" title="自动排版：重新理顺布局（使用模式下也可用，但不保存，退出使用模式即还原）">自动排版</button>
    <button onclick="ED.fit()">适应窗口</button>
    <span class="sep"></span>
    <button class="edit-only" onclick="ED.editFlowInfo()">流程信息…</button>
    <button class="edit-only" onclick="ED.viewChanges()" title="查看当前所有未保存改动（同保存预览），可逐条恢复">📋 查看修改</button>
    <button onclick="ED.search()" title="图内搜索（Ctrl+F）：按文字找节点/分组并定位居中">🔍 搜索</button>
    <button onclick="ED.help()">帮助</button>
    <span class="sep"></span>
    <span id="flowmeta"></span>
    <span id="dirty"></span>
    <span class="spacer"></span>
    <span id="hint">提示：右键空白处添加节点 · 滚轮缩放 · 拖动平移 · 详见“帮助”</span>
  </div>
  <div id="panel"></div>
  <div id="wrap">
    <canvas id="graph"></canvas>
    <!-- 折叠节点的可编辑参数浮层：真·DOM 控件，按图坐标定位，整体 transform 跟随画布平移/缩放 -->
    <div id="foldwidgets"></div>
    <!-- 资源监控迷你小窗（画布右上角常驻）：迷你曲线 + 简要数字，点击弹出独立的「资源监控」浮窗 -->
    <div id="sysmon" title="资源占用 · 点击弹出独立监控浮窗（可置顶/拖到屏幕任意处）" onclick="ED.toggleSysMon()">
      <canvas id="sysspark" width="116" height="26"></canvas>
      <div id="systext">CPU <b class="sm-cpu">--</b> · 内存 <b class="sm-mem">--</b></div>
    </div>
  </div>
  <div id="logresize" title="拖动调整日志高度"></div>
  <div id="logpanel"></div>
  <div id="toast"></div>

  <script src="vendor/litegraph.js"></script>
  <script src="editor.js"></script>
</body>
</html>
