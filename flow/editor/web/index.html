<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AOE4 Flow Editor</title>
<link rel="stylesheet" href="vendor/litegraph.css">
<style>
  /* —— 配色变量：统一深色主题 + 一个蓝色强调色 —— */
  :root {
    --bg: #1b1e25; --bg2: #20242c; --panel: #1e222a; --line: #2e333d;
    --fg: #d4d8e0; --fg-dim: #8b929e; --accent: #5a93d4; --warn: #e6a23c;
    --btn: #2b313b; --btn-h: #353c48; --btn-line: #3c434f;
  }
  /* 让原生控件(数字微调箭头/颜色选择器/下拉)走深色，不再是白色割裂感 */
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font-family: "Microsoft YaHei", "SimHei", sans-serif; overflow: hidden;
               -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  #toolbar { height: 42px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
             background: linear-gradient(#262b34, #20242c); border-bottom: 1px solid var(--line);
             overflow: hidden; box-shadow: 0 1px 0 #0003; }
  /* 按钮/下拉：固定大小，窗口变窄也不压缩、不换行 */
  #toolbar button, #toolbar select {
             background: var(--btn); color: var(--fg); border: 1px solid var(--btn-line); border-radius: 6px;
             height: 28px; padding: 0 12px; cursor: pointer; font-size: 13px;
             flex: none; white-space: nowrap; transition: background .12s, border-color .12s; }
  #toolbar button:hover, #toolbar select:hover { background: var(--btn-h); border-color: #4a5260; }
  #toolbar button:active { background: #2a303a; transform: translateY(1px); }
  #toolbar button:disabled { opacity: .45; cursor: default; }
  #toolbar button.accent { background: #2f6b3f; border-color: #3f8a52; color: #eafff0; }
  #toolbar button.accent:hover { background: #357a48; }
  #toolbar button.accent.running { background: #8a5a2f; border-color: #b07a3f; }
  #toolbar button:focus-visible, #toolbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #toolbar select { max-width: 220px; }
  #toolbar .sep { flex: none; width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #toolbar .spacer { flex: 1 1 auto; min-width: 6px; }
  /* 工具栏右侧只放“静态使用提示”，空间不足时自身截断（绝不挤压按钮/文件信息） */
  #hint { color: var(--fg-dim); font-size: 12px; flex: 0 1 auto; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dirty:not(:empty) { color: var(--warn); font-size: 11px; font-weight: bold; flex: none;
           background: #e6a23c1f; border: 1px solid #e6a23c55; border-radius: 10px; padding: 1px 8px; }
  /* 文件信息（当前在编辑哪个流程）：固定在工具栏左侧，不被操作提示覆盖 */
  #flowmeta { color: var(--fg); font-size: 12px; flex: 0 1 auto; min-width: 0; max-width: 320px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #flowmeta .ro { color: var(--warn); }
  /* 操作提示（已保存/已撤销/已排版…）：底部居中的临时浮层，几秒后淡出，不再和文件信息抢位置 */
  #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(6px);
           background: #2b3038f2; color: #eef1f5; border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 16px; font-size: 13px; box-shadow: 0 6px 22px #0009; z-index: 200;
           opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; max-width: 80%;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toolbar optgroup { color: var(--fg-dim); font-style: normal; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  canvas { display: block; }
  /* 控制面板：置顶常用开关/数值，普通用户不进节点图也能调（在节点说明里勾选要显示的参数）。 */
  #panel { flex: none; display: none; flex-wrap: wrap; align-items: center; gap: 8px 12px;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
           max-height: 28vh; overflow-y: auto; }
  #panel .ptitle { color: var(--fg-dim); font-size: 11px; font-weight: bold; letter-spacing: .5px;
           text-transform: uppercase; margin-right: 2px; }
  /* 每个面板项做成小卡片，分隔更清楚、更美观 */
  #panel .pitem { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg);
           background: #262b33; border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; }
  #panel .pitem label { color: #aeb6c2; max-width: 220px; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
  #panel input[type=number], #panel input[type=text], #panel select, #panel button {
           background: #15171c; color: var(--fg); border: 1px solid var(--btn-line); border-radius: 5px;
           height: 22px; font-size: 12px; }
  #panel button { background: var(--btn); cursor: pointer; padding: 0 8px; }
  #panel button:hover { background: var(--btn-h); }
  #panel input[type=number] { width: 60px; }
  #panel select { max-width: 160px; }
  #panel .ploc { cursor: pointer; font-size: 12px; opacity: 0.5; }
  #panel .ploc:hover { opacity: 1; }
  /* 运行日志面板：试运行时从底部弹出，显示引擎日志（哪个节点说了什么） */
  #logpanel { flex: none; display: none; height: 150px; overflow-y: auto; background: #15181e;
           border-top: 1px solid var(--line); padding: 6px 10px; font: 12px/1.5 Consolas, monospace; }
  #logpanel .lp-head { color: var(--fg-dim); position: sticky; top: -6px; background: #15181e;
           padding: 2px 0 4px; display: flex; align-items: center; gap: 8px; }
  #logpanel .lp-row { white-space: pre-wrap; word-break: break-word; }
  #logpanel .lv-INFO { color: #bcd; } #logpanel .lv-WARN { color: #e6c07b; }
  #logpanel .lv-ERROR { color: #ff9a9a; } #logpanel .lp-tick { color: #6c727c; }
  #logpanel .lp-clear { cursor: pointer; color: #7fb0ee; }
  /* 滚动条：细、暗，融入主题 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a414c; border-radius: 6px; border: 2px solid transparent;
           background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #4a525f; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="toolbar">
    <button onclick="ED.save()">保存</button>
    <button onclick="ED.saveAs()">另存为</button>
    <button onclick="ED.open()">打开</button>
    <select id="builtin" onchange="ED.openBuiltin(this.value)"><option value="" disabled selected>打开内置流程…</option></select>
    <span class="sep"></span>
    <button id="runbtn" class="accent" onclick="ED.toggleRun()">▶ 试运行</button>
    <button onclick="ED.step()" title="只跑一帧">单步</button>
    <button id="stopbtn" onclick="ED.stopRun()" disabled>停止</button>
    <select id="runspeed" onchange="ED.setSpeed(this.value)" title="运行速度（每帧间隔）">
      <option value="600">慢</option><option value="250" selected>中</option><option value="80">快</option>
    </select>
    <span class="sep"></span>
    <button onclick="ED.autolayout()">自动排版</button>
    <button onclick="ED.fit()">适应窗口</button>
    <span class="sep"></span>
    <button onclick="ED.editFlowInfo()">流程信息…</button>
    <button onclick="ED.help()">帮助</button>
    <span class="sep"></span>
    <span id="flowmeta"></span>
    <span id="dirty"></span>
    <span class="spacer"></span>
    <span id="hint">提示：右键空白处添加节点 · 滚轮缩放 · 拖动平移 · 详见“帮助”</span>
  </div>
  <div id="panel"></div>
  <div id="wrap"><canvas id="graph"></canvas></div>
  <div id="logpanel"></div>
  <div id="toast"></div>

  <script src="vendor/litegraph.js"></script>
  <script src="editor.js"></script>
</body>
</html>
